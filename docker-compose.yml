version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: xfin-postgres
    environment:
      POSTGRES_USER: xfin_user
      POSTGRES_PASSWORD: xfin_password
      POSTGRES_DB: xfin
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xfin_user -d xfin"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - xfin-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xfin-backend
    environment:
      DATABASE_URL: postgresql://xfin_user:xfin_password@postgres:5432/xfin?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-in-production
      NODE_ENV: development
      PORT: 3000
    ports:
      - "3000:3000"
      - "5555:5555"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - xfin-network
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xfin-frontend
    environment:
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - xfin-network


networks:
  xfin-network:
    driver: bridge

volumes:
  pg_data:

