services:
  mysql:
    image: mysql:8.0
    container_name: xfin-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - xfin-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xfin-backend
    restart: always
    env_file:
      - .env.prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - ENABLE_SEED=${ENABLE_SEED}
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mysql
    networks:
      - xfin-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xfin-frontend
    restart: always
    networks:
      - xfin-network
    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine
    container_name: xfin-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - xfin-network

volumes:
  mysql_data:
  uploads:
  certs:

networks:
  xfin-network:
    driver: bridge
